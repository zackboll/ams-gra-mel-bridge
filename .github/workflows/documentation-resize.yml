name: Documentation resize qualification (non-deploying)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: 'Full 40-hex baseline commit SHA; must be a strict ancestor of the selected source'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  DOC_SOURCE_SHA: ${{ github.sha }}
  ALIRE_SETTINGS_DIR: ${{ github.workspace }}/.doc-tools/settings

jobs:
  resize-browser:
    name: Complete publication parity and Chromium sidebar interaction
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.DOC_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact event source and baseline (no fallback)
        run: python3 docs/tools/documentation_qualification_source.py
      - name: Install official pinned documentation tools
        run: sh docs/tools/install_docs_toolchain.sh
      - name: Reconstruct complete baseline and exact-head candidate
        run: |
          git worktree add --detach .doc-tools/resize-baseline-source "$BASE_SOURCE_SHA"
          sh .doc-tools/resize-baseline-source/docs/tools/install_enhancer.sh .doc-tools/resize-baseline-enhancer
          alr -n -s "$ALIRE_SETTINGS_DIR" -C docs/toolchain exec -- sh -c '
            cd ../..
            GITHUB_ACTIONS=false .doc-tools/resize-baseline-enhancer/bin/python .doc-tools/resize-baseline-source/docs/tools/docs_ci.py build \
              --root "$PWD/.doc-tools/resize-baseline-source" \
              --directory "$PWD/.doc-tools/resize-baseline" --gnatdoc-prefix "$PWD/.doc-tools/gnatdoc-26.0.0" &&
            .doc-tools/enhancer/bin/python docs/tools/docs_ci.py build \
              --directory "$PWD/.doc-tools/resize-current" --gnatdoc-prefix "$PWD/.doc-tools/gnatdoc-26.0.0" &&
            .doc-tools/enhancer/bin/python docs/tools/docs_ci.py build \
              --directory "$PWD/.doc-tools/resize-repeated" --gnatdoc-prefix "$PWD/.doc-tools/gnatdoc-26.0.0" &&
            .doc-tools/enhancer/bin/python docs/tools/docs_ci.py qualify \
              --directory "$PWD/.doc-tools/resize-qualified" --gnatdoc-prefix "$PWD/.doc-tools/gnatdoc-26.0.0" &&
            # Parity is source-local: real content changes across commits are not sidebar regressions.
            GITHUB_ACTIONS=false .doc-tools/resize-baseline-enhancer/bin/python .doc-tools/resize-baseline-source/docs/tools/resize_parity.py \
              --root .doc-tools/resize-baseline-source \
              --candidate .doc-tools/resize-baseline \
              --manifest-sha "$(sha256sum .doc-tools/resize-baseline/manifest.json | cut -d " " -f 1)" \
              --output .doc-tools/resize-baseline-parity.json &&
            .doc-tools/enhancer/bin/python docs/tools/resize_parity.py \
              --candidate .doc-tools/resize-current \
              --manifest-sha "$(sha256sum .doc-tools/resize-current/manifest.json | cut -d " " -f 1)" \
              --repeated .doc-tools/resize-repeated \
              --repeated-manifest-sha "$(sha256sum .doc-tools/resize-repeated/manifest.json | cut -d " " -f 1)" \
              --output .doc-tools/resize-parity.json &&
            MEL_RESIZE_CANDIDATE="$PWD/.doc-tools/resize-current" \
              MEL_RESIZE_REGRESSION_EVIDENCE="$PWD/.doc-tools/resize-regression.json" \
              GNATDOC_PREFIX="$PWD/.doc-tools/gnatdoc-26.0.0" \
              .doc-tools/enhancer/bin/python -W error -m unittest discover \
                -s docs/tests -p test_resize_parity.py -v &&
            MEL_RESIZE_QUALIFICATION="$PWD/.doc-tools/resize-qualified" \
              .doc-tools/enhancer/bin/python -W error -m unittest discover \
                -s docs/tests -p test_resize_publication.py -v &&
            .doc-tools/enhancer/bin/python -W error -m unittest discover \
              -s docs/tests -p test_enhancer_release.py -v'
      - name: Install isolated Chromium qualification tools
        run: |
          python3 -m venv .doc-tools/browser
          .doc-tools/browser/bin/pip install playwright==1.64.0
          .doc-tools/browser/bin/playwright install --with-deps chromium
      - name: Resize complete MEL site including mandatory search regression
        run: |
          .doc-tools/browser/bin/python docs/tools/resize_browser.py \
            --site .doc-tools/resize-current/published --output .doc-tools/resize-browser.json
      - name: Retain non-authorizing diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: resize-qualification-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.DOC_SOURCE_SHA }}
          path: |
            .doc-tools/resize-baseline/
            .doc-tools/resize-current/
            .doc-tools/resize-repeated/
            .doc-tools/resize-qualified/
            .doc-tools/resize-qualified-generation.log
            .doc-tools/resize-parity.json
            .doc-tools/resize-regression.json
            .doc-tools/resize-baseline-parity.json
            .doc-tools/resize-source.json
            .doc-tools/resize-browser.json
          if-no-files-found: warn
