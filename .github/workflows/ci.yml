name: Bootstrap checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          if [[ "${{ matrix.compiler }}" == "clang" ]]; then
            export CC=clang CXX=clang++
          else
            export CC=gcc CXX=g++
          fi
          cmake -S native -B build/native \
            -DAMS_MEL_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build and test
        run: |
          cmake --build build/native --parallel 2
          ctest --test-dir build/native --output-on-failure
          ctest --test-dir build/native --parallel 4 \
            --repeat until-fail:50 --output-on-failure
      - name: Test native installation
        run: cmake --install build/native --prefix "$PWD/build/install"

  build-tree-isolation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prove production and test build trees stay isolated
        run: make test-build-isolation

  ada:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install hosted Ada toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnat gprbuild
      - name: Direct GPR Ada smoke test
        run: make test-ada
      - name: Set up Alire
        uses: alire-project/setup-alire@v6
      - name: Check Ada formatting
        run: make check-ada-format

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Build production facade
        run: make native
      - name: Build test facade and mock providers
        run: make test-native
      # Contract tests use the test-enabled facade and providers explicitly.
      # cargo check/clippy keep the production default in native/build.
      - name: Check Rust workspace
        run: cargo check --manifest-path rust/Cargo.toml --workspace
      - name: Test Rust workspace
        env:
          AMS_MEL_NATIVE_LIB_DIR: ${{ github.workspace }}/native/build-tests/lib
          AMS_MEL_TEST_PROVIDER_DIR: ${{ github.workspace }}/native/build-tests/test-providers
        run: cargo test --manifest-path rust/Cargo.toml --workspace
      - name: Lint Rust workspace
        run: >-
          cargo clippy --manifest-path rust/Cargo.toml
          --workspace --all-targets -- -D warnings
      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build test facade and mock providers
        run: make test-native
      # Contract tests bind the test-enabled facade from the isolated test tree.
      - name: Test Python binding
        env:
          PYTHONPATH: python
          AMS_MEL_NATIVE_LIB: ${{ github.workspace }}/native/build-tests/lib/libams_mel_c.so.0
          AMS_MEL_TEST_PROVIDER_DIR: ${{ github.workspace }}/native/build-tests/test-providers
        run: python3 -W error -m unittest discover -s python/tests -v
      - name: Compile Python package
        env:
          PYTHONPATH: python
          AMS_MEL_NATIVE_LIB: ${{ github.workspace }}/native/build-tests/lib/libams_mel_c.so.0
        run: python3 -W error -m compileall -q python/ams_mel

# No remote run has occurred at bootstrap time.
# This uses the host Ada toolchain, not Alire resolution; add a separately
# validated Alire/package job before submitting either crate to an index.
# Pin action references to reviewed commit SHAs before a public release.
