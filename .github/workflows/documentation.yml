name: Ada API Documentation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  DOC_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  ALIRE_SETTINGS_DIR: ${{ github.workspace }}/.doc-tools/settings

concurrency:
  group: documentation-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.inputs.outputs.artifact-id }}
      bundle_sha: ${{ steps.seal.outputs.bundle_sha }}
      manifest_sha: ${{ steps.seal.outputs.manifest_sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.DOC_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install isolated pinned documentation tools
        run: sh docs/tools/install_docs_toolchain.sh
      - name: Check dependency integrity and deployment boundaries
        run: python3 scripts/check_doc_source_integrity.py
      - name: Test current documentation build controls
        run: make test-docs-ci
      - name: Generate once from Git and verify source-derived publication
        id: seal
        env:
          GNATDOC_PREFIX: ${{ github.workspace }}/.doc-tools/gnatdoc-26.0.0
        run: |
          alr -n -s "$ALIRE_SETTINGS_DIR" -C docs/toolchain exec -- sh -c \
            'cd ../..; .doc-tools/enhancer/bin/python docs/tools/docs_ci.py build --gnatdoc-prefix "$GNATDOC_PREFIX"'
      - name: Upload verified same-run inputs
        id: inputs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: documentation-inputs-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.DOC_SOURCE_SHA }}
          path: .doc-tools/current.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload non-authorizing diagnostics and coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: documentation-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.DOC_SOURCE_SHA }}
          path: |
            .doc-tools/current/*.log
            .doc-tools/current/*.json
          if-no-files-found: warn

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact qualified source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.DOC_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download exact same-run verified inputs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/verified-download
          merge-multiple: true
      - name: Install immutable reviewed enhancer
        run: sh docs/tools/install_enhancer.sh .doc-tools/enhancer
      - name: Verify bundle, source, run, presentation and main-only authority
        run: |
          .doc-tools/enhancer/bin/python docs/tools/docs_ci.py unpack --deployment \
            --bundle "$RUNNER_TEMP/verified-download/current.tar" \
            --bundle-sha '${{ needs.build.outputs.bundle_sha }}' \
            --manifest-sha '${{ needs.build.outputs.manifest_sha }}'
      - name: Upload verified main-only Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.DOC_SOURCE_SHA }}
          path: .doc-tools/current/published/
          include-hidden-files: true
      - name: Deploy validated main site
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.DOC_SOURCE_SHA }}

  verify-live:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact deployed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.DOC_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download exact same-run verified inputs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/verified-download
          merge-multiple: true
      - name: Install immutable reviewed enhancer
        run: sh docs/tools/install_enhancer.sh .doc-tools/enhancer
      - name: Verify deployed artifact authority
        run: |
          .doc-tools/enhancer/bin/python docs/tools/docs_ci.py unpack --deployment \
            --bundle "$RUNNER_TEMP/verified-download/current.tar" \
            --bundle-sha '${{ needs.build.outputs.bundle_sha }}' \
            --manifest-sha '${{ needs.build.outputs.manifest_sha }}'
      - name: Compare every live entity with the verified artifact
        run: |
          .doc-tools/enhancer/bin/python docs/tools/docs_ci.py live --deployment \
            --manifest-sha '${{ needs.build.outputs.manifest_sha }}' \
            --base-url https://zackboll.github.io/ams-gra-mel-bridge/ \
            --evidence "$RUNNER_TEMP/live-publication.json"
      - name: Upload live verification diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: live-publication-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.DOC_SOURCE_SHA }}
          path: ${{ runner.temp }}/live-publication.json
          if-no-files-found: warn
