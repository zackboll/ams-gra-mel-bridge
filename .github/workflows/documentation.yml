name: Ada API Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  DOC_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  ALIRE_SETTINGS_DIR: ${{ github.workspace }}/.doc-tools/settings

concurrency:
  group: documentation-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare-documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.inputs.outputs.artifact-id }}
      bundle_sha: ${{ steps.seal.outputs.bundle_sha }}
      manifest_sha: ${{ steps.seal.outputs.manifest_sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Record checkout
        run: |
          test "$(git rev-parse HEAD)" = "$DOC_SOURCE_SHA"
          git fetch origin main
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            number=$(python3 -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["number"])')
            git fetch origin "refs/pull/$number/head:refs/remotes/origin/pull/$number/head"
          fi
      - name: Install Alire 2.1.1
        run: |
          curl --fail --location --output /tmp/alire.zip https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip
          unzip /tmp/alire.zip -d /tmp/alire
          sudo install -m 0755 /tmp/alire/bin/alr /usr/local/bin/alr
      - name: Install isolated documentation tools
        run: |
          mkdir -p .doc-tools/settings
          alr -n -s "$PWD/.doc-tools/settings" --force toolchain --select gnat_native=16.1.0 gprbuild=26.0.1
          alr -n -s "$PWD/.doc-tools/settings" install --prefix="$PWD/.doc-tools/gnatdoc-26.0.0" gnatdoc_bin=26.0.0
          alr -s "$PWD/.doc-tools/settings" toolchain
      - name: Install exact reviewed documentation enhancer distribution
        run: sh docs/tools/install_enhancer.sh .doc-tools/enhancer
      - name: Select event-bound target policy or isolated policy-review case
        id: authority
        run: .doc-tools/enhancer/bin/python docs/tools/epoch_ci.py select
      - name: Establish historical and candidate epochs, qualify, then seal completed inputs
        id: seal
        env:
          GNATDOC_PREFIX: ${{ github.workspace }}/.doc-tools/gnatdoc-26.0.0
          CC: /usr/bin/gcc
          CXX: /usr/bin/g++
          POLICY_RUNNER: ${{ steps.authority.outputs.runner }}
        run: |
          alr -n -s "$PWD/.doc-tools/settings" -C docs/toolchain exec -- sh -c \
            'cd ../..; .doc-tools/enhancer/bin/python "$POLICY_RUNNER" prepare --root "$PWD" --gnatdoc-prefix "$GNATDOC_PREFIX"'
          cp .doc-tools/epochs/inputs.tar "$RUNNER_TEMP/qualified-inputs.tar"
      - name: Upload same-run qualified inputs
        id: inputs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: documentation-inputs-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.DOC_SOURCE_SHA }}
          path: ${{ runner.temp }}/qualified-inputs.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload diagnostics and coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gnatdoc-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.DOC_SOURCE_SHA }}
          path: |
            .doc-tools/epochs/logs/*
            .doc-tools/epochs/*.json

  enhanced-tests:
    name: enhanced-tests (${{ matrix.shard }})
    needs: prepare-documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [navigation, publication, live, symbols-catalog, types, remaining]
    steps:
      - name: Checkout identical source head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.DOC_SOURCE_SHA }}
          fetch-depth: 0
      - name: Download exact preparation artifact ID from this run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.prepare-documentation.outputs.artifact_id }}
          path: ${{ runner.temp }}/qualified-download
          merge-multiple: true
      - name: Install immutable reviewed enhancer
        run: sh docs/tools/install_enhancer.sh .doc-tools/enhancer
      - name: Select event-bound target policy or isolated policy-review case
        id: authority
        run: .doc-tools/enhancer/bin/python docs/tools/epoch_ci.py select
      - name: Verify and unpack private qualified inputs
        run: |
          .doc-tools/enhancer/bin/python '${{ steps.authority.outputs.runner }}' unpack --root "$PWD" \
            --bundle "$RUNNER_TEMP/qualified-download/qualified-inputs.tar" \
            --bundle-sha '${{ needs.prepare-documentation.outputs.bundle_sha }}' \
            --manifest-sha '${{ needs.prepare-documentation.outputs.manifest_sha }}'
      - name: Execute assigned tests exactly once
        run: |
          .doc-tools/enhancer/bin/python '${{ steps.authority.outputs.runner }}' run --root "$PWD" \
            --owner '${{ matrix.shard }}' --output "$RUNNER_TEMP/results/${{ matrix.shard }}.json" \
            --artifact-id '${{ needs.prepare-documentation.outputs.artifact_id }}' \
            --bundle-sha '${{ needs.prepare-documentation.outputs.bundle_sha }}' \
            --manifest-sha '${{ needs.prepare-documentation.outputs.manifest_sha }}'
      - name: Upload detailed execution result even on failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: documentation-result-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.DOC_SOURCE_SHA }}
          path: ${{ runner.temp }}/results/${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 30

  # Keep the merge-required check name. Never let a failed dependency skip it.
  build:
    if: always()
    needs: [prepare-documentation, enhanced-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      gate_id: ${{ steps.gate-upload.outputs.artifact-id }}
      gate_sha: ${{ steps.aggregate.outputs.gate_sha }}
    steps:
      - name: Reject failed, missing, cancelled or skipped dependencies
        env:
          DOC_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['DOC_NEEDS'])
          assert set(jobs) == {'prepare-documentation', 'enhanced-tests'}, jobs
          assert all(j['result'] == 'success' for j in jobs.values()), jobs
          PY
      - name: Checkout identical source head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.DOC_SOURCE_SHA }}
          fetch-depth: 0
      - name: Download exact preparation artifact ID
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.prepare-documentation.outputs.artifact_id }}
          path: ${{ runner.temp }}/qualified-download
          merge-multiple: true
      - name: Download same-run shard execution artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: documentation-result-*-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.DOC_SOURCE_SHA }}
          path: ${{ runner.temp }}/shard-results
      - name: Install immutable reviewed enhancer for source-derived discovery
        run: sh docs/tools/install_enhancer.sh .doc-tools/enhancer
      - name: Select event-bound target policy or isolated policy-review case
        id: authority
        run: .doc-tools/enhancer/bin/python docs/tools/epoch_ci.py select
      - name: Verify qualified inputs
        run: |
          .doc-tools/enhancer/bin/python '${{ steps.authority.outputs.runner }}' unpack --root "$PWD" \
            --bundle "$RUNNER_TEMP/qualified-download/qualified-inputs.tar" \
            --bundle-sha '${{ needs.prepare-documentation.outputs.bundle_sha }}' \
            --manifest-sha '${{ needs.prepare-documentation.outputs.manifest_sha }}'
      - name: Reconcile every execution identity and issue deployment gate
        id: aggregate
        env:
          DOC_NEEDS: ${{ toJSON(needs) }}
        run: |
          .doc-tools/enhancer/bin/python '${{ steps.authority.outputs.runner }}' aggregate --root "$PWD" \
            --reports "$RUNNER_TEMP/shard-results" --output "$RUNNER_TEMP/gate.json" \
            --artifact-id '${{ needs.prepare-documentation.outputs.artifact_id }}' \
            --bundle-sha '${{ needs.prepare-documentation.outputs.bundle_sha }}' \
            --manifest-sha '${{ needs.prepare-documentation.outputs.manifest_sha }}'
      - name: Upload immutable successful aggregate gate
        id: gate-upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: documentation-gate-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.DOC_SOURCE_SHA }}
          path: ${{ runner.temp }}/gate.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [prepare-documentation, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact qualified source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.DOC_SOURCE_SHA }}
          fetch-depth: 0
      - name: Download exact qualified inputs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.prepare-documentation.outputs.artifact_id }}
          path: ${{ runner.temp }}/qualified-download
          merge-multiple: true
      - name: Download successful aggregate authorization
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.build.outputs.gate_id }}
          path: ${{ runner.temp }}/gate
          merge-multiple: true
      - name: Install immutable reviewed enhancer
        run: sh docs/tools/install_enhancer.sh .doc-tools/enhancer
      - name: Select merged-main event-bound authority
        id: authority
        run: .doc-tools/enhancer/bin/python docs/tools/epoch_ci.py select
      - name: Reject unqualified or changed deployment inputs
        run: |
          .doc-tools/enhancer/bin/python '${{ steps.authority.outputs.runner }}' unpack --root "$PWD" \
            --bundle "$RUNNER_TEMP/qualified-download/qualified-inputs.tar" \
            --bundle-sha '${{ needs.prepare-documentation.outputs.bundle_sha }}' \
            --manifest-sha '${{ needs.prepare-documentation.outputs.manifest_sha }}'
          .doc-tools/enhancer/bin/python '${{ steps.authority.outputs.runner }}' deployment --root "$PWD" \
            --gate "$RUNNER_TEMP/gate/gate.json" --gate-sha '${{ needs.build.outputs.gate_sha }}' \
            --artifact-id '${{ needs.prepare-documentation.outputs.artifact_id }}' \
            --bundle-sha '${{ needs.prepare-documentation.outputs.bundle_sha }}' \
            --manifest-sha '${{ needs.prepare-documentation.outputs.manifest_sha }}'
      - name: Upload aggregate-authorized main-only Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.DOC_SOURCE_SHA }}
          path: .doc-tools/epochs/candidate/published/
          include-hidden-files: true
      - name: Deploy validated main site
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.DOC_SOURCE_SHA }}

  verify-live:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [prepare-documentation, build, deploy]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact deployed run SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Confirm checkout identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Download exact same-run qualified inputs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.prepare-documentation.outputs.artifact_id }}
          path: ${{ runner.temp }}/qualified-download
          merge-multiple: true
      - name: Download exact successful aggregate gate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.build.outputs.gate_id }}
          path: ${{ runner.temp }}/gate
          merge-multiple: true
      - name: Install immutable reviewed enhancer
        run: sh docs/tools/install_enhancer.sh .doc-tools/live-enhancer
      - name: Select merged-main event-bound authority
        id: authority
        run: .doc-tools/live-enhancer/bin/python docs/tools/epoch_ci.py select
      - name: Verify live authority artifact identities
        run: |
          .doc-tools/live-enhancer/bin/python '${{ steps.authority.outputs.runner }}' unpack --root "$PWD" \
            --bundle "$RUNNER_TEMP/qualified-download/qualified-inputs.tar" \
            --bundle-sha '${{ needs.prepare-documentation.outputs.bundle_sha }}' \
            --manifest-sha '${{ needs.prepare-documentation.outputs.manifest_sha }}'
          .doc-tools/live-enhancer/bin/python '${{ steps.authority.outputs.runner }}' deployment --root "$PWD" \
            --gate "$RUNNER_TEMP/gate/gate.json" --gate-sha '${{ needs.build.outputs.gate_sha }}' \
            --artifact-id '${{ needs.prepare-documentation.outputs.artifact_id }}' \
            --bundle-sha '${{ needs.prepare-documentation.outputs.bundle_sha }}' \
            --manifest-sha '${{ needs.prepare-documentation.outputs.manifest_sha }}'
      - name: Verify all live entities and source-owned publication contracts
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          .doc-tools/live-enhancer/bin/python '${{ steps.authority.outputs.runner }}' live --root "$PWD" \
            --manifest-sha '${{ needs.prepare-documentation.outputs.manifest_sha }}' \
            --base-url https://zackboll.github.io/ams-gra-mel-bridge/ \
            --expected-commit "$EXPECTED_SHA" --attempts 10 --interval 30 \
            --evidence "$RUNNER_TEMP/live-publication.json"
      - name: Upload live verification diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: live-publication-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/live-publication.json
          if-no-files-found: warn
