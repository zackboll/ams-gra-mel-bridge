name = "ams_mel_tests"
version = "0.1.0-dev"
description = "Provider-free smoke tests for the AMS MEL Ada bootstrap"
licenses = "Apache-2.0"
project-files = ["ams_mel_tests.gpr"]
executables = ["ams_mel_smoke"]

[configuration]
disabled = true

[[depends-on]]
ams_mel = "=0.1.0-dev"

[[pins]]
ams_mel = { path = ".." }
ams_mel_c = { path = "../../native" }

[[actions]]
type = "test"
command = ["alr", "run"]
